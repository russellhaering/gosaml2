on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

name: Test
permissions:
  contents: read

jobs:
  format:
    name: gofmt
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
          check-latest: true
      # Run once rather than per matrix entry: formatting does not vary by the
      # Go version under test, only by the gofmt doing the checking.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run 'gofmt -w .' and commit the result."
            exit 1
          fi
          echo "All files are gofmt-formatted."

  test:
    name: Test Go ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum (1.23.x)
            go: '1.23.x'
          - name: oldstable
            go: oldstable
          - name: stable
            go: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
      - name: Test
        run: |
          go version
          go test ./...
